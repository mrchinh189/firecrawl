services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resin}
      POSTGRES_DB: ${POSTGRES_DB:-resin}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resin}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  collector:
    build: ./collector
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-resin}:${POSTGRES_PASSWORD:-resin}@db:5432/${POSTGRES_DB:-resin}
      SOURCES_PATH: /app/sources.json
    volumes:
      - ./sources.json:/app/sources.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-resin}:${POSTGRES_PASSWORD:-resin}@db:5432/${POSTGRES_DB:-resin}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
